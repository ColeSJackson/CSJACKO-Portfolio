<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CSJACKO">
  <!--
    Black square, red wordmark.

    Set on two lines rather than one. A favicon renders at 16 to 32px in a tab,
    and CSJACKO across a single 64px line solves to roughly 7px a letter, which
    is a red smudge at that size. Split, each line gets more than twice the
    height and the mark stays readable where it is actually seen.

    Heavy system sans rather than Groovy Madness: an SVG favicon cannot reach
    the site's webfont, so naming it would only fall through to whatever the OS
    picks anyway. A stated bold stack is at least predictable.
  -->
  <rect width="64" height="64" fill="#000000"/>
  <g
    fill="#e62317"
    font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="900"
    text-anchor="middle"
  >
    <text x="32" y="30" font-size="27" letter-spacing="-1">CS</text>
    <text x="32" y="53" font-size="14.5" letter-spacing="-0.5">JACKO</text>
  </g>
</svg>
